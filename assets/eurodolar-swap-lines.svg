<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc">
  <title id="title">Cómo una swap line lleva dólares de la Fed al sistema offshore</title>
  <desc id="desc">Bancos fuera de Estados Unidos sufren presión de liquidez, un banco central extranjero recibe dólares de la Reserva Federal mediante una swap line y los presta a su sistema.</desc>
  <rect width="1400" height="800" fill="#F4F0E7"/>
  <rect x="74" y="70" width="190" height="42" fill="#FFD400"/>
  <g fill="#111111" font-family="Arial, Helvetica, sans-serif">
    <text x="91" y="99" font-size="22" font-weight="700" letter-spacing="1">EURODÓLAR · 02</text>
    <text x="78" y="202" font-size="72" font-weight="800">CUANDO TODOS QUIEREN DÓLARES</text>
    <text x="80" y="269" font-size="34">Crear depósitos no elimina el problema de conseguir liquidez.</text>
  </g>
  <g fill="#F4F0E7" stroke="#111111" stroke-width="4">
    <rect x="82" y="415" width="330" height="195"/>
    <rect x="540" y="415" width="330" height="195"/>
    <rect x="998" y="415" width="320" height="195"/>
  </g>
  <g stroke="#D93A2F" stroke-width="7" fill="none">
    <path d="M412 513 H520"/>
    <path d="M498 492 L520 513 L498 534"/>
  </g>
  <g stroke="#111111" stroke-width="5" fill="none">
    <path d="M998 513 H892"/>
    <path d="M914 492 L892 513 L914 534"/>
  </g>
  <rect x="886" y="466" width="112" height="34" fill="#FFD400" transform="rotate(-2 886 466)"/>
  <g fill="#111111" font-family="Arial, Helvetica, sans-serif">
    <text x="110" y="460" font-size="28" font-weight="700">BANCOS OFFSHORE</text>
    <text x="112" y="508" font-size="23">Pasivos en dólares</text>
    <text x="112" y="546" font-size="23">vencen hoy.</text>
    <text x="112" y="585" font-size="23" font-weight="700" fill="#D93A2F">FALTA LIQUIDEZ</text>
    <text x="566" y="460" font-size="28" font-weight="700">BANCO CENTRAL</text>
    <text x="566" y="508" font-size="23">Recibe dólares</text>
    <text x="566" y="546" font-size="23">y los presta a bancos</text>
    <text x="566" y="584" font-size="23">de su jurisdicción.</text>
    <text x="1023" y="460" font-size="28" font-weight="700">RESERVA FEDERAL</text>
    <text x="1023" y="508" font-size="23">Entrega dólares</text>
    <text x="1023" y="546" font-size="23">contra moneda local.</text>
    <text x="438" y="490" font-size="20" font-weight="700" fill="#D93A2F">PRESIÓN</text>
    <text x="892" y="490" font-size="20" font-weight="700">SWAP LINE</text>
    <text x="80" y="698" font-size="31" font-weight="700">LA IRONÍA</text>
    <text x="282" y="698" font-size="30">un mercado offshore puede necesitar una válvula conectada a la Fed.</text>
    <text x="82" y="754" font-size="25" font-style="italic">El problema no es que los dólares “desaparezcan”; es conseguirlos justo cuando toca pagar.</text>
  </g>
  <path d="M282 711 C560 690 810 723 1188 705" stroke="#FFD400" stroke-width="13" opacity="0.95" fill="none"/>
</svg>