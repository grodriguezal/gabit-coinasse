    <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
    <feComponentTransfer in="mono"><feFuncA type="table" tableValues="0 0.07"/></feComponentTransfer>
    <feBlend in="SourceGraphic" mode="multiply"/>
  </filter>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="7" dy="9" stdDeviation="5" flood-color="#111111" flood-opacity="0.18"/></filter>
  <clipPath id="tagA"><path d="M0 18 L17 4 160 9 179 2 198 12 201 66 185 74 23 69 7 75Z"/></clipPath>
  <clipPath id="scrap"><path d="M0 15 L37 6 82 13 126 4 169 13 213 6 256 15 295 4 330 14 330 225 293 216 249 224 205 216 165 224 120 215 74 224 35 216 0 224Z"/></clipPath>
</defs>
