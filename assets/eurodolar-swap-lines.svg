<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1280" role="img" aria-labelledby="title desc">
<title id="title">Collage editorial sobre financiación en dólares y swap lines</title>
<desc id="desc">Collage sobre papel hueso con documentos, bancos y pilas de monedas unidos por una línea amarilla que representa el acceso a liquidez en dólares.</desc>
<defs>
