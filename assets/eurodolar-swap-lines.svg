<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Liquidez en dólares y líneas swap</title>
  <desc id="desc">Collage editorial realista en blanco y negro con tres bloques institucionales y documentos conectados por una línea amarilla que representa el acceso extraordinario a dólares.</desc>
  <defs>
    <filter id="mono"><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncR type="linear" slope="1.1" intercept="-0.04"/><feFuncG type="linear" slope="1.1" intercept="-0.04"/><feFuncB type="linear" slope="1.1" intercept="-0.04"/></feComponentTransfer></filter>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="2" seed="31" result="n"/><feColorMatrix in="n" type="saturate" values="0" result="g"/><feComponentTransfer in="g"><feFuncA type="table" tableValues="0 0.075"/></feComponentTransfer></filter>
    <clipPath id="left"><path d="M40 110 L388 92 424 118 414 588 388 610 70 598 42 570Z"/></clipPath>
    <clipPath id="mid"><path d="M430 72 L772 90 794 116 786 584 758 610 452 600 420 572Z"/></clipPath>
    <clipPath id="right"><path d="M798 112 L1150 92 1170 120 1158 590 1132 614 824 600 790 568Z"/></clipPath>
  </defs>
  <rect width="1200" height="720" fill="#F4F0E7"/>
  <rect x="18" y="18" width="1164" height="684" fill="none" stroke="#111111" stroke-width="2"/>

  <g opacity="0.14" transform="translate(8 10)"><path d="M40 110 L388 92 424 118 414 588 388 610 70 598 42 570Z" fill="#111111"/><path d="M430 72 L772 90 794 116 786 584 758 610 452 600 420 572Z" fill="#111111"/><path d="M798 112 L1150 92 1170 120 1158 590 1132 614 824 600 790 568Z" fill="#111111"/></g>

  <g clip-path="url(#left)" filter="url(#mono)"><image href="bank-loan-deposit-ledger.webp" x="18" y="78" width="430" height="555" preserveAspectRatio="xMidYMid slice"/></g>
  <g clip-path="url(#mid)" filter="url(#mono)"><image href="library/collages/poder-dinero-master-01.png" x="390" y="55" width="430" height="575" preserveAspectRatio="xMidYMid slice"/></g>
  <g clip-path="url(#right)" filter="url(#mono)"><image href="bond-future-payments-collage.webp" x="772" y="78" width="420" height="555" preserveAspectRatio="xMidYMid slice"/></g>

