<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="t d"><title id="t">El bucle entre deuda, tipos y política monetaria</title><desc id="d">Un tren de deuda recorre un circuito entre un gobierno y un banco central: los tipos altos elevan gradualmente el coste de refinanciación y aumentan la tensión fiscal.</desc><rect width="1200" height="800" fill="#F4F0E7"/><g fill="none" stroke="#111" stroke-width="5"><path d="M130 570 C170 290 410 180 620 210 C880 245 1050 390 1020 570 C980 735 700 720 500 690 C300 660 120 650 130 570Z"/><path d="M160 570 C190 340 420 230 610 250 C820 270 980 405 975 550 C965 660 735 675 515 645 C305 615 160 625 160 570Z"/></g><g fill="#111"><rect x="210" y="410" width="245" height="155"/><polygon points="185,410 333,320 480,410"/><rect x="245" y="455" width="35" height="110" fill="#F4F0E7"/><rect x="315" y="455" width="35" height="110" fill="#F4F0E7"/><rect x="385" y="455" width="35" height="110" fill="#F4F0E7"/><rect x="735" y="375" width="250" height="190"/><polygon points="710,375 860,285 1010,375"/><rect x="770" y="420" width="38" height="145" fill="#F4F0E7"/><rect x="840" y="420" width="38" height="145" fill="#F4F0E7"/><rect x="910" y="420" width="38" height="145" fill="#F4F0E7"/></g><g font-family="Arial, sans-serif" font-weight="700" fill="#111"><text x="240" y="600" font-size="30">GOBIERNO</text><text x="755" y="600" font-size="30">BANCO CENTRAL</text><text x="430" y="115" font-size="54">DEUDA → TIPOS → TENSIÓN</text></g><g stroke="#FFD400" stroke-width="34" fill="none" stroke-linecap="square"><path d="M465 345 C560 280 665 285 735 340"/><path d="M725 635 C625 700 505 690 430 620"/></g><g fill="#111"><rect x="510" y="320" width="150" height="90"/><rect x="545" y="292" width="150" height="90"/><rect x="580" y="264" width="150" height="90"/></g><g font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#F4F0E7"><text x="536" y="370">BONOS</text><text x="570" y="342">BONOS</text><text x="605" y="314">BONOS</text></g><g fill="#D93A2F"><path d="M490 210 l35 -75 l35 75 h-22 v65 h-26 v-65z"/><path d="M570 190 l35 -105 l35 105 h-22 v85 h-26 v-85z"/><path d="M650 205 l35 -135 l35 135 h-22 v70 h-26 v-70z"/></g><g font-family="Arial, sans-serif" fill="#111"><text x="80" y="750" font-size="22">El bucle no es automático. La pregunta es cuándo la deuda empieza a limitar la política monetaria.</text></g></svg>