<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">Tres fondos. ¿Tres riesgos?</title><desc id="desc">Tres cajas etiquetadas S&amp;P 500, Nasdaq-100 y Dow conectan con una exposición común a grandes empresas estadounidenses. Las reglas y los pesos difieren; el riesgo puede repetirse.</desc>
<rect width="1200" height="800" fill="#F4F0E7"/>
<g fill="#111111" font-family="Arial, sans-serif"><text x="60" y="90" font-size="58" font-weight="900">TRES FONDOS.</text><text x="60" y="160" font-size="58" font-weight="900">¿TRES RIESGOS?</text></g>
<g stroke="#111111" stroke-width="4" fill="none"><rect x="60" y="240" width="330" height="130"/><rect x="435" y="240" width="330" height="130"/><rect x="810" y="240" width="330" height="130"/><path d="M225 370v70h375v60M600 370v130M975 370v70H600"/></g>
<g font-family="Arial, sans-serif" fill="#111111" font-size="43" font-weight="800" text-anchor="middle"><text x="225" y="320">S&amp;P 500</text><text x="600" y="320">NASDAQ-100</text><text x="975" y="320">DOW</text></g>
<path d="M95 501l1000-5 7 163-1003 8z" fill="#FFD400"/>
<g font-family="Arial, sans-serif" text-anchor="middle" fill="#111111"><text x="600" y="561" font-size="41" font-weight="900">GRANDES EMPRESAS</text><text x="600" y="615" font-size="41" font-weight="900">ESTADOUNIDENSES</text><text x="600" y="725" font-size="32">Reglas distintas. Exposiciones que se repiten.</text></g>
</svg>
