<title id="ttl">El coste invisible de las comisiones compuestas</title>
<desc id="desc">Collage editorial crema, negro y amarillo: dos trayectorias parten de 10.000 euros y después de treinta años terminan en 76.123 euros sin costes y 48.373 euros con una comisión anual del 1,5 por ciento. La brecha es 27.750 euros.</desc>
