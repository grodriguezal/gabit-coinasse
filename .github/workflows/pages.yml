name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # Durante una publicación se actualizan varios archivos en commits consecutivos.
  # Se da un breve margen para que termine esa serie de cambios y se comprueba
  # qué commit es realmente el último. Los antiguos finalizan correctamente
  # sin generar despliegues parciales ni cancelaciones de workflows.
  comprobar-version:
    name: Comprobar versión más reciente
    runs-on: ubuntu-latest
    outputs:
      publicar: ${{ steps.version.outputs.publicar }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Esperar a que termine el lote de cambios
        run: sleep 60
      - name: Descartar commits que ya han sido sustituidos
        id: version
        shell: bash
        run: |
          set -euo pipefail
          latest="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$latest" = "$GITHUB_SHA" ]; then
            echo "publicar=true" >> "$GITHUB_OUTPUT"
            echo "Versión vigente: $GITHUB_SHA"
          else
            echo "publicar=false" >> "$GITHUB_OUTPUT"
            echo "Sin despliegue: el commit $GITHUB_SHA fue sustituido por $latest"
          fi

  deploy:
    name: Publicar versión vigente
    needs: comprobar-version
    if: needs.comprobar-version.outputs.publicar == 'true'
    runs-on: ubuntu-latest
    # No cancelar una publicación en marcha. Una versión posterior esperará
    # su turno y reemplazará a la anterior al concluir correctamente.
    concurrency:
      group: gabit-github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Verificar estructura mínima para Pages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          required = [
              "index.html",
              "articulos/index.html",
              "analisis-de-empresas/index.html",
              "sitemap.xml",
              "styles.css",
              "v1.css",
          ]
          missing = [path for path in required if not Path(path).is_file()]
          if missing:
              raise SystemExit("Faltan archivos esenciales: " + ", ".join(missing))
          home = Path("index.html").read_text(encoding="utf-8")
          assert 'id="featured-title"' in home, "Falta Destacados"
          assert 'id="analisis-empresas"' in home, "Falta Análisis de empresas"
          assert 'id="latest-general-list"' in home, "Falta Lo último"
          print("PASS: estructura esencial preparada")
          PY
      # La portada es una selección editorial y puede cambiar entre commits.
      # Las auditorías de contenido no deben tumbar la publicación completa.
      - name: Auditar SEO sin bloquear la publicación
        continue-on-error: true
        run: python3 tools/validate_seo.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
