name: Generar Gabit Coinasse Audio

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/generate-audio.yml'
      - 'tools/generate_article_audio.py'
      - 'dinero/tokenizacion-activos-agentes-liquidez/index.html'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gabit-audio-tokenizacion
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: pip

      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Instalar MeloTTS y utilidades
        run: |
          python -m pip install --upgrade pip setuptools wheel
          git clone --depth 1 https://github.com/myshell-ai/MeloTTS.git /tmp/MeloTTS
          python -m pip install -e /tmp/MeloTTS
          python -m pip install beautifulsoup4 pydub
          python -m unidic download

      - name: Generar MP3 del artículo
        run: |
          python tools/generate_article_audio.py \
            dinero/tokenizacion-activos-agentes-liquidez/index.html \
            assets/audio/tokenizacion-activos-agentes-liquidez.mp3 \
            --speed 0.94

      - name: Comprobar audio
        run: |
          test -s assets/audio/tokenizacion-activos-agentes-liquidez.mp3
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 assets/audio/tokenizacion-activos-agentes-liquidez.mp3

      - name: Guardar MP3 en el repositorio
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/audio/tokenizacion-activos-agentes-liquidez.mp3
          if git diff --cached --quiet; then
            echo 'El audio ya está actualizado.'
          else
            git commit -m 'Generate open-source audio for tokenization article'
            git push
          fi
